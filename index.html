<!DOCTYPE html>
<html>
  <head>
    <title>Document</title>
    <base target="_top">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body { 
        background-color: #f0f4f8; 
        font-family: 'Inter', sans-serif; 
        color: #334e68;
        padding: 40px 20px;
      }
      .card { 
        max-width: 750px; 
        margin: auto; 
        background: white; 
        padding: 40px; 
        border-radius: 20px; 
        border: none;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
      }
      h3 { 
        font-weight: 600; 
        color: #102a43; 
        margin-bottom: 30px; 
        text-align: center;
      }
      .form-label { 
        font-weight: 600; 
        font-size: 0.9rem;
        color: #486581;
        margin-bottom: 8px;
      }
      .form-control { 
        border-radius: 10px; 
        border: 1px solid #d9e2ec;
        padding: 12px 15px;
        background-color: #f9fafb;
      }
      .form-control:focus {
        border-color: #627d98;
        box-shadow: 0 0 0 3px rgba(98, 125, 152, 0.1);
        background-color: #fff;
      }
      .btn-primary { 
        background-color: #243b53; 
        border: none; 
        padding: 15px; 
        border-radius: 12px;
        font-weight: 600;
        transition: all 0.3s ease;
        margin-top: 20px;
      }
      .btn-primary:hover { 
        background-color: #102a43; 
        transform: translateY(-2px);
      }
      .status-msg {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        display: none;
      }
    </style>
  </head>
  <body>

    <div class="card">
      <h3>Laporan Pasien</h3>
      
      <form id="apotekForm">
        <div class="mb-4">
          <label class="form-label">Nama Lengkap Pasien</label>
          <input type="text" name="nama" class="form-control" placeholder="Contoh: Budi Santoso" required>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label">Tanggal Kunjungan</label>
            <input type="date" id="tgl_kunjungan" name="tgl_kunjungan" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Usia (Tahun)</label>
            <input type="number" id="usia" name="usia" class="form-control" placeholder="Masukkan usia pasien" required>
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label">Alamat</label>
            <input type="text" name="alamat" class="form-control" placeholder="Nama kota/kecamatan" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Pekerjaan</label>
            <input type="text" name="pekerjaan" class="form-control" placeholder="Contoh: Wiraswasta" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Keluhan Utama</label>
          <textarea name="keluhan" class="form-control" rows="2" placeholder="Apa yang dirasakan pasien?" required></textarea>
        </div>

        <div class="mb-4">
          <label class="form-label">Diagnosis</label>
          <textarea name="diagnosis" class="form-control" rows="2" placeholder="Hasil pemeriksaan medis" required></textarea>
        </div>

        <div class="mb-4">
          <label class="form-label">Terapi / Obat</label>
          <textarea name="terapi" class="form-control" rows="2" placeholder="Daftar obat dan dosis" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Simpan Rekam Medis</button>
      </form>

      <div id="status" class="status-msg text-center fw-bold"></div>
    </div>

    <script>
      // Mengisi otomatis tanggal kunjungan dengan tanggal hari ini saat halaman dimuat
      window.addEventListener('DOMContentLoaded', (event) => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('tgl_kunjungan').value = today;
      });

      // Proses submit form
      document.getElementById('apotekForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const statusDiv = document.getElementById('status');
        
        btn.disabled = true;
        btn.innerText = "Sedang Memproses...";
        statusDiv.style.display = "none";

        google.script.run
          .withSuccessHandler(function(res) {
            statusDiv.style.display = "block";
            statusDiv.className = "status-msg text-center fw-bold alert alert-success";
            statusDiv.innerText = res;
            document.getElementById('apotekForm').reset();
            
            // Isi kembali tanggal kunjungan ke hari ini setelah form di-reset
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('tgl_kunjungan').value = today;

            btn.disabled = false;
            btn.innerText = "Simpan Rekam Medis";
          })
          .withFailureHandler(function(err) {
            statusDiv.style.display = "block";
            statusDiv.className = "status-msg text-center fw-bold alert alert-danger";
            statusDiv.innerText = "Kesalahan: " + err;
            btn.disabled = false;
            btn.innerText = "Coba Lagi";
          })
          .simpanData(this);
      });
    </script>
  </body>
</html>
