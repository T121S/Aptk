<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
  <base target="_top">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  
  <style>
    body { background-color: #f8f9fa; padding: 20px; font-family: 'Segoe UI', sans-serif; }
    .card-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
    .hidden { display: none; }
    label { font-weight: bold; margin-top: 15px; font-size: 0.9rem; display: block; color: #334e68; }
    .status-msg { margin-top: 15px; display: none; padding: 10px; border-radius: 8px; text-align: center; font-weight: 600; }
    
    /* Penyesuaian UI Select2 agar serasi dengan Bootstrap 5 */
    .select2-container--default .select2-selection--multiple {
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 4px;
      min-height: 40px;
    }
    .select2-container--default.select2-container--focus .select2-selection--multiple {
      border-color: #86b7fe;
      outline: 0;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
    .select2-container--default .select2-selection--multiple .select2-selection__choice {
      background-color: #0d6efd;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 2px 6px;
      margin-top: 4px;
    }
    .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
      color: white;
      margin-right: 5px;
    }
    .select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover {
      background-color: transparent;
      color: #ffcccc;
    }
  </style>
</head>
<body>

  <div id="loginPage" class="card-box" style="max-width: 350px; margin-top: 15vh;">
    <h4 class="text-center mb-4">Apotek Login</h4>
    <input type="text" id="u" class="form-control mb-2" placeholder="Username">
    <input type="password" id="p" class="form-control mb-3" placeholder="Password">
    <button onclick="login()" id="btnL" class="btn btn-primary w-100">MASUK</button>
  </div>

  <div id="formPage" class="card-box hidden" style="max-width: 650px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 id="txtPetugas" class="text-primary m-0"></h6>
      <button onclick="location.reload()" class="btn btn-sm btn-outline-danger">Logout</button>
    </div>
    <hr>
    
    <form id="f">
      <label>Nama Lengkap Pasien</label>
      <input type="text" id="nama" class="form-control" placeholder="Nama pasien..." required>
      
      <div class="row">
        <div class="col-6">
          <label>Tanggal Lahir</label>
          <input type="date" id="tgl" class="form-control" required>
        </div>
        <div class="col-6">
          <label>Usia (Otomatis)</label>
          <input type="number" id="usia" class="form-control" readonly required>
        </div>
      </div>

      <div class="row">
        <div class="col-6">
          <label>Alamat</label>
          <input type="text" id="alm" class="form-control" placeholder="Kecamatan/Kota" required>
        </div>
        <div class="col-6">
          <label>Pekerjaan</label>
          <input type="text" id="pek" class="form-control" placeholder="Pekerjaan pasien" required>
        </div>
      </div>

      <label>Keluhan Utama</label>
      <select id="kel" class="form-control select2-tags" multiple="multiple" style="width: 100%;" required>
        <option value="Demam">Demam</option>
        <option value="Batuk">Batuk</option>
        <option value="Pilek">Pilek</option>
        <option value="Pusing">Pusing</option>
        <option value="Mual">Mual</option>
        <option value="Nyeri Sendi">Nyeri Sendi</option>
      </select>

      <label>Diagnosis Medis</label>
      <select id="dia" class="form-control select2-tags" multiple="multiple" style="width: 100%;" required>
        <option value="ISPA">ISPA</option>
        <option value="Dispepsia">Dispepsia</option>
        <option value="Hipertensi">Hipertensi</option>
        <option value="Myalgia">Myalgia</option>
        <option value="Dermatitis">Dermatitis</option>
      </select>

      <label>Terapi / Daftar Obat</label>
      <select id="terapiObat" class="form-control select2-tags" multiple="multiple" style="width: 100%;" required>
        <option value="Paracetamol 500mg">Paracetamol 500mg</option>
        <option value="Amoxicillin 500mg">Amoxicillin 500mg</option>
        <option value="Ibuprofen 400mg">Ibuprofen 400mg</option>
        <option value="Cetirizine 10mg">Cetirizine 10mg</option>
        <option value="Omeprazole 20mg">Omeprazole 20mg</option>
        <option value="Metformin 500mg">Metformin 500mg</option>
        <option value="Vitamin C 500mg">Vitamin C 500mg</option>
        <option value="Antasida Doen">Antasida Doen</option>
      </select>

      <button type="submit" id="btnS" class="btn btn-primary w-100 mt-4 py-2 fw-bold">SIMPAN DATA PASIEN</button>
    </form>

    <div id="msgStatus" class="status-msg"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <script>
    let pAktif = "";

    // Inisialisasi Fitur Multi-Select Tags untuk ketiga select
    $(document).ready(function() {
      $('.select2-tags').select2({
        placeholder: "Pilih dari daftar atau ketik baru lalu Enter...",
        allowClear: true,
        tags: true, // Memungkinkan input manual di luar daftar
        tokenSeparators: [','] // Memisahkan tag dengan tanda koma
      });
    });

    // Proses Login
    function login() {
      const btn = document.getElementById('btnL');
      btn.disabled = true; btn.innerText = "Mengecek...";
      google.script.run
        .withSuccessHandler(res => {
          if(res.success) {
            pAktif = res.user;
            document.getElementById('txtPetugas').innerText = "Petugas: " + res.user;
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('formPage').classList.remove('hidden');
          } else {
            alert(res.msg); btn.disabled = false; btn.innerText = "MASUK";
          }
        })
        .cekLogin(document.getElementById('u').value, document.getElementById('p').value);
    }

    // Hitung Usia Otomatis
    document.getElementById('tgl').onchange = function() {
      if(this.value) {
        document.getElementById('usia').value = new Date().getFullYear() - new Date(this.value).getFullYear();
      }
    };

    // Proses Simpan Data
    document.getElementById('f').onsubmit = function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnS');
      const statusDiv = document.getElementById('msgStatus');
      
      btn.disabled = true; 
      btn.innerText = "Proses Simpan...";
      statusDiv.style.display = "none";
      
      // Menangkap nilai Select2 dan menggabungkannya dengan koma, gunakan array kosong [] jika null
      const keluhanTerpilih = $('#kel').val() || [];
      const diagnosisTerpilih = $('#dia').val() || [];
      const obatTerpilih = $('#terapiObat').val() || [];

      const d = {
        petugas: pAktif,
        nama: document.getElementById('nama').value,
        tgl_lahir: document.getElementById('tgl').value,
        usia: document.getElementById('usia').value,
        alamat: document.getElementById('alm').value,
        pekerjaan: document.getElementById('pek').value,
        // .join(', ') akan mengubah Array ["Batuk", "Pilek"] menjadi String "Batuk, Pilek"
        keluhan: keluhanTerpilih.join(', '),
        diagnosis: diagnosisTerpilih.join(', '),
        terapi: obatTerpilih.join(', ') 
      };

      google.script.run
        .withSuccessHandler(res => {
          statusDiv.style.display = "block";
          if(res.includes("Berhasil")) {
            statusDiv.className = "status-msg alert alert-success";
            statusDiv.innerText = res;
            
            // Reset Form HTML standar
            document.getElementById('f').reset();
            // Reset ketiga Select2 UI
            $('.select2-tags').val(null).trigger('change'); 
            
            setTimeout(() => { statusDiv.style.display = "none"; }, 5000);
          } else {
            statusDiv.className = "status-msg alert alert-danger";
            statusDiv.innerText = res;
          }
          btn.disabled = false; 
          btn.innerText = "SIMPAN DATA PASIEN";
        })
        .withFailureHandler(err => {
          statusDiv.style.display = "block";
          statusDiv.className = "status-msg alert alert-danger";
          statusDiv.innerText = "Error Fatal: " + err;
          btn.disabled = false; 
          btn.innerText = "SIMPAN DATA PASIEN";
        })
        .simpanData(d);
    };
  </script>
</body>
</html>
